<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ronnell — Links</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a0f;
      --surface: #0e1117;
      --border: #1e2330;
      --accent: #c8f560;
      --accent2: #4af0c4;
      --text: #e8eaf0;
      --muted: #5a6070;
      --card-bg: #10131a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    /* Animated grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    /* Background glow blobs */
    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(200,245,96,0.06) 0%, transparent 70%);
      top: -150px; left: -150px;
      animation: driftA 14s ease-in-out infinite alternate;
    }
    .bg-glow-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(74,240,196,0.05) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: driftB 18s ease-in-out infinite alternate;
    }

    @keyframes driftA {
      from { transform: translate(0, 0); }
      to   { transform: translate(60px, 80px); }
    }
    @keyframes driftB {
      from { transform: translate(0, 0); }
      to   { transform: translate(-50px, -60px); }
    }

    /* Main layout */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px 40px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Avatar */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      animation: fadeUp 0.8s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      color: #080a0f;
      position: relative;
    }

    .avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      z-index: -1;
      opacity: 0.3;
      filter: blur(8px);
    }

    /* Name & Bio */
    .name {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      text-align: center;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      animation: fadeUp 0.8s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .handle {
      font-size: 11px;
      color: var(--accent);
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      animation: fadeUp 0.8s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .bio {
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 36px;
      font-weight: 300;
      animation: fadeUp 0.8s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
      animation: fadeUp 0.8s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(200,245,96,0.04), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .link-btn:hover {
      border-color: rgba(200,245,96,0.35);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(200,245,96,0.1);
    }

    .link-btn:hover::before { opacity: 1; }

    .link-btn:active { transform: translateY(0); }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(200,245,96,0.08);
      border: 1px solid rgba(200,245,96,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s;
    }

    .link-btn:hover .link-icon {
      background: rgba(200,245,96,0.15);
    }

    .link-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }

    .link-text { flex: 1; }
    .link-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .link-sub {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 300;
    }

    .link-arrow {
      color: var(--muted);
      font-size: 16px;
      transition: transform 0.25s, color 0.25s;
    }
    .link-btn:hover .link-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* Staggered link animations */
    .link-btn:nth-child(1) { animation: fadeUp 0.7s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .link-btn:nth-child(2) { animation: fadeUp 0.7s 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .link-btn:nth-child(3) { animation: fadeUp 0.7s 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* Footer */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: fadeUp 0.7s 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .footer span {
      color: var(--accent);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="container">
    <div class="card">

      <div class="avatar-wrap">
        <div class="avatar">R</div>
      </div>

      <h1 class="name">Ronnell</h1>
      <p class="handle">@tcmronnell</p>
      <p class="bio">Student. Developer. Creative.<br/>Turning ideas into things that live on the internet.</p>

      <div class="divider"></div>

      <div class="links">

        <!-- GitHub -->
        <a class="link-btn" href="https://github.com/tcmronnell" target="_blank" rel="noopener">
          <div class="link-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
          </div>
          <div class="link-text">
            <span class="link-label">GitHub</span>
            <span class="link-sub">github.com/tcmronnell</span>
          </div>
          <span class="link-arrow">→</span>
        </a>

      </div>
    </div>

    <p class="footer">made by <span>ronnell</span> · 2026</p>
  </div>

</body>
</html>
